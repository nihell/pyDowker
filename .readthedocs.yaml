version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Build the C++ extension so autodoc can import it
      - pip install scikit-build-core pybind11 ninja
      - pip install --no-build-isolation -e ".[docs,multipers]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - multipers
